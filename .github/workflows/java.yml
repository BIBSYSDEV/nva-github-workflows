# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Java build workflow"
permissions:
  contents: read
  checks: write

on:
  workflow_call:
    inputs:
      java_version:
        description: "Java version to use"
        type: string
        required: false
        default: "21"
      java_distribution:
        description: "JDK distribution to use"
        type: string
        required: false
        default: "corretto"
      openapi_files:
        description: "Glob pattern for OpenAPI files to lint (e.g., 'docs/*.yaml'). Leave empty to skip."
        type: string
        required: false
        default: ""
      lint_cloudformation:
        description: "Run linter for CloudFormation template"
        type: boolean
        required: false
        default: true
      cloudformation_template:
        description: "Name of CloudFormation template file"
        type: string
        required: false
        default: "template.yaml"
      code_coverage_report_path:
        description: "Path to the code coverage report file"
        type: string
        required: false
        default: "build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml"

    secrets:
      codacy_token:
        description: "Access token for Codacy"
        required: true

jobs:
  cloudformation-linter:
    name: CloudFormation linting
    runs-on: ubuntu-latest
    if: inputs.lint_cloudformation == true
    steps:
      - uses: actions/checkout@v6

      - name: Setup CloudFormation Linter
        uses: scottbrenner/cfn-lint-action@v2

      - name: Run CloudFormation linter
        run: |
          cfn-lint --version
          cfn-lint -t ${{ inputs.cloudformation_template }} --info

  openapi-linting:
    name: OpenAPI linting
    runs-on: ubuntu-latest
    if: inputs.openapi_files != ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli

      - name: Lint OpenAPI files
        run: spectral lint '${{ inputs.openapi_files }}' --fail-severity=error

  dependency-submission:
    name: Dependency graph
    # Dependency graphs are only accepted for the default branch, skip job on other branches
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK ${{ inputs.java_version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java_version }}
          distribution: ${{ inputs.java_distribution }}

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

  build:
    name: Gradle build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK ${{ inputs.java_version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java_version }}
          distribution: ${{ inputs.java_distribution }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"
          cache-read-only: false

      - name: Build with Gradle
        run: ./gradlew build --info

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "**/build/test-results/**/*.xml"

      - name: Codacy Coverage Reporter
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        with:
          project-token: ${{ secrets.codacy_token }}
          coverage-reports: $(pwd)/${{ inputs.code_coverage_report_path }}
