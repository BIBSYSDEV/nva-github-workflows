# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Java build workflow"
permissions:
  contents: write # To submit dependency graph
  checks: write # To publish test results
  pull-requests: write # To comment on PRs

on:
  workflow_call:
    inputs:
      java_version:
        description: "Java version to use"
        type: string
        required: false
        default: "21"
      java_distribution:
        description: "JDK distribution to use"
        type: string
        required: false
        default: "corretto"
      openapi_files:
        description: "Deprecated: Use 'lint_openapi' instead. Kept temporarily to avoid breaking callers."
        type: string
        required: false
        default: ""
      lint_openapi:
        description: "Run OpenAPI linter for files matching 'docs/**/*.yaml'"
        type: boolean
        required: false
        default: true
      lint_cloudformation:
        description: "Run linter for CloudFormation template"
        type: boolean
        required: false
        default: true
      code_coverage_report_path:
        description: "Path to the code coverage report file"
        type: string
        required: false
        default: "build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml"

    secrets:
      codacy_token:
        description: "Access token for Codacy"
        required: true

jobs:
  cloudformation-linter:
    name: CloudFormation linting
    runs-on: ubuntu-latest
    if: inputs.lint_cloudformation == true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup CloudFormation Linter
        uses: scottbrenner/cfn-lint-action@ed184e91f5085a2932501da8314e899e5e0ef5be # v.2.7.1
        with:
          version: "1.53.3"

      - name: Run CloudFormation linter
        run: |
          cfn-lint --version
          cfn-lint -t template.yaml --info

  openapi-linting:
    name: OpenAPI linting
    runs-on: ubuntu-latest
    if: inputs.lint_openapi == true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli

      - name: Lint OpenAPI files
        run: spectral lint 'docs/**/*.yaml' --fail-severity=error

  dependency-submission:
    name: Dependency graph
    # Dependency graphs are only accepted for the default branch, skip job on other branches
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ inputs.java_version }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: ${{ inputs.java_version }}
          distribution: ${{ inputs.java_distribution }}

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

  build:
    name: Gradle build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ inputs.java_version }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: ${{ inputs.java_version }}
          distribution: ${{ inputs.java_distribution }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"
          cache-read-only: false

      - name: Build with Gradle
        run: ./gradlew build --info

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: always()
        with:
          files: "**/build/test-results/**/*.xml"

      - name: Codacy Coverage Reporter
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.codacy_token }}
          coverage-reports: $(pwd)/${{ inputs.code_coverage_report_path }}
