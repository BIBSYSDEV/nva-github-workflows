# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Java build workflow"
permissions:
  contents: write # To submit dependency graph
  checks: write # To publish test results
  pull-requests: write # To comment on PRs

on:
  workflow_call:
    inputs:
      java_version:
        description: "Java version to use"
        type: string
        required: false
        default: "21"
      java_distribution:
        description: "JDK distribution to use"
        type: string
        required: false
        default: "corretto"
      openapi_files:
        description: "Deprecated and ignored. Kept to avoid breaking callers. Lint OpenAPI with nva.spectral in nva-gradle-plugins."
        type: string
        required: false
        default: ""
      lint_openapi:
        description: "Deprecated and ignored. Kept to avoid breaking callers. Lint OpenAPI with nva.spectral in nva-gradle-plugins."
        type: boolean
        required: false
        default: true
      lint_cloudformation:
        description: "Run cfn-lint on template.yaml, or on the templates listed in the repository's .cfnlintrc"
        type: boolean
        required: false
        default: true
      code_coverage_report_path:
        description: "Path to the code coverage report file"
        type: string
        required: false
        default: "build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml"

    secrets:
      codacy_token:
        description: "Access token for Codacy"
        required: true

jobs:
  cloudformation-linter:
    name: CloudFormation linting
    runs-on: ubuntu-latest
    if: inputs.lint_cloudformation == true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup CloudFormation Linter
        uses: scottbrenner/cfn-lint-action@8affffc34dddd6937bbc37f60901f71657e20fab # v2.8.0
        with:
          version: "1.53.3"

      # Other templates are listed in the caller's .cfnlintrc, not passed as an input, which CodeQL flags as code injection
      - name: Run CloudFormation linter
        run: |
          cfn-lint --version
          if grep -qsE '^templates:' .cfnlintrc .cfnlintrc.yaml .cfnlintrc.yml; then
            cfn-lint --info
          else
            cfn-lint -t template.yaml --info
          fi

  dependency-submission:
    name: Dependency graph
    # Dependency graphs are only accepted for the default branch, skip job on other branches
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ inputs.java_version }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ inputs.java_version }}
          distribution: ${{ inputs.java_distribution }}

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

  build:
    name: Gradle build
    runs-on: ubuntu-latest
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.codacy_token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ inputs.java_version }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ inputs.java_version }}
          distribution: ${{ inputs.java_distribution }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"
          cache-read-only: false

      - name: Build with Gradle
        run: ./gradlew build --info

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2.26.0
        if: always()
        with:
          files: "**/build/test-results/**/*.xml"

      # Runs triggered by Dependabot or from forks get an empty token
      - name: Codacy Coverage Reporter
        if: env.CODACY_PROJECT_TOKEN != ''
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ env.CODACY_PROJECT_TOKEN }}
          coverage-reports: $(pwd)/${{ inputs.code_coverage_report_path }}
